name: Verify calculations and staged cash flow

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify calculations and browser-model parity
        run: python -m unittest discover -s tests -v
      - name: Generate steady-state assessment
        run: python assess.py examples/manufacturing.json
      - name: Generate staged-rollout cash flow
        run: python cashflow.py examples/staged-rollout.json --output-dir artifacts/cashflow
      - name: Show the investment reports
        run: cat artifacts/assessment.md artifacts/cashflow/cashflow.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reproducible evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: value-evidence-python-${{ matrix.python-version }}
          path: |
            artifacts/assessment.md
            artifacts/assessment.json
            artifacts/cashflow/cashflow.md
            artifacts/cashflow/cashflow.json
          if-no-files-found: error
          retention-days: 14
